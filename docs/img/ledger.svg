<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="每条记忆都有自己的户口：来源、状态、关联">
  <defs>
    <linearGradient id="paper2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf8f1"/>
      <stop offset="1" stop-color="#f1ebde"/>
    </linearGradient>
    <filter id="sh2" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#7a6a4a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="560" fill="url(#paper2)"/>
  <rect x="0" y="0" width="1200" height="6" fill="#c9a227"/>

  <g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
    <text x="64" y="80" font-size="34" font-weight="700" fill="#16324f">每条记忆都有自己的户口</text>
    <text x="64" y="116" font-size="18" fill="#7a6a4a">记的时候把「谁说的、算不算数、和谁有关」钉死，读的时候就不用猜</text>
  </g>

  <!-- 代码行 -->
  <g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
    <text x="64" y="158" font-size="15" fill="#a08f6f">facts.jsonl 里的一行</text>
    <rect x="64" y="170" width="1072" height="86" rx="12" fill="#16324f" filter="url(#sh2)"/>
    <text x="88" y="214" font-size="15" font-family="ui-monospace,Consolas,monospace" fill="#eaf4ff">{"time":"2026-11-01T06:34:00Z","content":"插件上架 PR 已开","source":"tool","status":"active","subject":"pr-11066"}</text>
    <text x="88" y="240" font-size="14" font-family="ui-monospace,Consolas,monospace" fill="#8fb3d4">纯文本一行一条 · 任何语言任何平台都能读 · 不被 DSH 绑架</text>
  </g>

  <!-- 三张卡 -->
  <g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
    <!-- A 来源 -->
    <rect x="64" y="288" width="336" height="212" rx="14" fill="#ffffff" stroke="#e3d9c4" filter="url(#sh2)"/>
    <text x="88" y="324" font-size="19" font-weight="700" fill="#16324f">来源 source</text>
    <text x="88" y="350" font-size="14" fill="#a08f6f">谁说的，写的时候就钉死</text>
    <g font-size="16">
      <rect x="88" y="366" width="288" height="26" rx="6" fill="#f7f3ea"/>
      <text x="98" y="385" font-family="ui-monospace,Consolas,monospace" fill="#1c4d7d">owner</text>
      <text x="188" y="385" fill="#7a6a4a">主人原话</text>
    </g>
    <g font-size="16">
      <rect x="88" y="396" width="288" height="26" rx="6" fill="#f7f3ea"/>
      <text x="98" y="415" font-family="ui-monospace,Consolas,monospace" fill="#1c4d7d">self</text>
      <text x="188" y="415" fill="#7a6a4a">自己答应过的</text>
    </g>
    <g font-size="16">
      <rect x="88" y="426" width="288" height="26" rx="6" fill="#f7f3ea"/>
      <text x="98" y="445" font-family="ui-monospace,Consolas,monospace" fill="#1c4d7d">evidence</text>
      <text x="188" y="445" fill="#7a6a4a">有据可查的观察</text>
    </g>
    <g font-size="16">
      <rect x="88" y="456" width="288" height="26" rx="6" fill="#f7f3ea"/>
      <text x="98" y="475" font-family="ui-monospace,Consolas,monospace" fill="#1c4d7d">inferred</text>
      <text x="188" y="475" fill="#7a6a4a">推断，永远垫底</text>
    </g>

    <!-- B 状态 -->
    <rect x="436" y="288" width="336" height="212" rx="14" fill="#ffffff" stroke="#c9a227" stroke-width="2" filter="url(#sh2)"/>
    <text x="460" y="324" font-size="19" font-weight="700" fill="#16324f">状态 status</text>
    <text x="460" y="350" font-size="14" fill="#a08f6f">作废是盖章，不是烧档案</text>
    <g font-size="16">
      <circle cx="468" cy="378" r="5" fill="#2ea44f"/>
      <text x="486" y="384" font-family="ui-monospace,Consolas,monospace" fill="#1c4d7d">active</text>
      <text x="580" y="384" fill="#7a6a4a">当前生效</text>
    </g>
    <g font-size="16">
      <circle cx="468" cy="414" r="5" fill="#c9a227"/>
      <text x="486" y="420" font-family="ui-monospace,Consolas,monospace" fill="#1c4d7d">superseded</text>
      <text x="614" y="420" fill="#7a6a4a">已作废，留痕</text>
    </g>
    <g font-size="16">
      <circle cx="468" cy="450" r="5" fill="#8fb3d4"/>
      <text x="486" y="456" font-family="ui-monospace,Consolas,monospace" fill="#1c4d7d">archived</text>
      <text x="596" y="456" fill="#7a6a4a">退休，翻得出来</text>
    </g>
    <text x="460" y="484" font-size="14" fill="#a08f6f">同键 subject 再记一条，旧的自动盖章作废</text>

    <!-- C 关联 -->
    <rect x="808" y="288" width="328" height="212" rx="14" fill="#ffffff" stroke="#e3d9c4" filter="url(#sh2)"/>
    <text x="832" y="324" font-size="19" font-weight="700" fill="#16324f">关联 related</text>
    <text x="832" y="350" font-size="14" fill="#a08f6f">写的时候就把关系挂上</text>
    <text x="832" y="386" font-size="16" font-family="ui-monospace,Consolas,monospace" fill="#1c4d7d">related: [id, id, ...]</text>
    <text x="832" y="418" font-size="16" fill="#7a6a4a">一条最多挂 5 条</text>
    <text x="832" y="448" font-size="16" fill="#7a6a4a">回忆命中时顺手带出</text>
    <text x="832" y="478" font-size="14" fill="#a08f6f">最多 3 条，标「关联」</text>
  </g>

  <line x1="64" y1="524" x2="1136" y2="524" stroke="#e3d9c4"/>
  <text x="64" y="550" font-size="15" fill="#7a6a4a" font-family="'PingFang SC','Microsoft YaHei',sans-serif">生态里的记忆插件大多解决「记住」；这个解决「记住的东西还算不算数」</text>
</svg>
